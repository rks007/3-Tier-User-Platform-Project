name: Enterprise DevSecOps CICD Pipeline
on:
  push:
    branches:
      - main
    paths:
      - client/**
      - server/**
      - .github/workflows/ci.yaml
  
jobs:
  gitleaks-scan:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Gitleaks Scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect \
            --source=/repo \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            --redact \
            --exit-code 0
            
      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn
          

  trivy-fs-scan:
    name: Trivy FS Scan (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    strategy:
      matrix:
        target: [client, server]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
 
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: latest
          cache: true
 
      - name: Verify Trivy installation
        run: |
          trivy --version
          which trivy
 
      - name: Run Trivy FS scan (JSON)
        run: |
          trivy fs ./${{ matrix.target }} \
            --format json \
            --output ${{ matrix.target }}-trivy-fs-report.json \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0
 
      - name: Run Trivy FS scan (TABLE)
        run: |
          trivy fs ./${{ matrix.target }} \
            --format table \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 > ${{ matrix.target }}-trivy-fs-report.txt
 
      - name: Upload Trivy JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-trivy-fs-json-report
          path: ${{ matrix.target }}-trivy-fs-report.json
          if-no-files-found: warn
 
      - name: Upload Trivy TABLE report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-trivy-fs-table-report
          path: ${{ matrix.target }}-trivy-fs-report.txt
          if-no-files-found: warn

  build-scan-and-push:
    runs-on: ubuntu-latest
    needs: trivy-fs-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
 
      - name: Build docker image
        run: docker build -t ${{ vars.DOCKERHUB_USERNAME }}/3-tier-app-gitactions:${{ github.sha }} .
 
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: latest
          cache: true
 
      - name: Run Trivy image scan (JSON)
        run: |
          trivy image ${{ vars.DOCKERHUB_USERNAME }}/3-tier-app-gitactions:${{ github.sha }} \
            --format json \
            --output image-trivy-report.json \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0
 
      - name: Run Trivy image scan (TABLE)
        run: |
          trivy image ${{ vars.DOCKERHUB_USERNAME }}/3-tier-app-gitactions:${{ github.sha }} \
            --format table \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 > image-trivy-report.txt
 
      - name: Upload Trivy image JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-trivy-json-report
          path: image-trivy-report.json
          if-no-files-found: warn
 
      - name: Upload Trivy image TABLE report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-trivy-table-report
          path: image-trivy-report.txt
          if-no-files-found: warn

      - name: Generate source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: source-sbom.spdx.json
          upload-artifact: true

      - name: Generate image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ vars.DOCKERHUB_USERNAME }}/3-tier-app-gitactions:${{ github.sha }}
          format: spdx-json
          output-file: image-sbom.spdx.json
          upload-artifact: true      
 
      - name: Push docker image
        run: docker push ${{ vars.DOCKERHUB_USERNAME }}/3-tier-app-gitactions:${{ github.sha }}

  update-qa-manifest:
    name: Update QA Manifest
    needs: build-scan-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout qa branch
        uses: actions/checkout@v4
 
      - name: Update image tag in manifest
        run: |
          sed -i "s|image: ${{ vars.DOCKERHUB_USERNAME }}/3-tier-app-gitactions:.*|image: ${{ vars.DOCKERHUB_USERNAME }}/3-tier-app-gitactions:${GITHUB_SHA}|g" k8-manifests/qa/app-deployment.yaml
 
      - name: Show updated manifest (debug)
        run: |
          cat k8-manifests/qa/app-deployment.yaml
 
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8-manifests/qa/app-deployment.yaml
          git commit -m "Update QA image to ${GITHUB_SHA} [skip ci]" || echo "No changes to commit"
          git push origin main     

  deploy-to-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: update-qa-manifest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-south-1
      EKS_CLUSTER_NAME: my-cluster
      K8S_NAMESPACE: qa
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main   # explicitly pull latest main, not the trigger SHA
 
      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
 
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
 
      - name: Generate kubeconfig for EKS
        run: aws eks update-kubeconfig --region "${AWS_REGION}" --name "${EKS_CLUSTER_NAME}"
 
      - name: Verify identity
        run: |
          aws sts get-caller-identity
          kubectl config current-context
 
      - name: Verify namespace access
        run: |
          kubectl get pods -n "${K8S_NAMESPACE}"
          kubectl get services -n "${K8S_NAMESPACE}"
          kubectl auth can-i create deployments -n "${K8S_NAMESPACE}"
          kubectl auth can-i create services -n "${K8S_NAMESPACE}"
          kubectl auth can-i create ingresses.networking.k8s.io -n "${K8S_NAMESPACE}"
 
      - name: Deploy manifests
        run: |
          kubectl apply -f k8-manifests/qa/ -n "${K8S_NAMESPACE}"
 
      - name: Verify rollout
        run: |
          kubectl rollout status deployment/nodejs-app -n "${K8S_NAMESPACE}" --timeout=180s
          
